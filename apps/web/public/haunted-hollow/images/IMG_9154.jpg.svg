<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#0a0a12"/>
  <!-- Large statement candle - pillar style -->
  <rect x="145" y="130" width="110" height="190" rx="6" fill="#e8d5a3"/>
  <rect x="145" y="130" width="110" height="190" rx="6" fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0.4"/>
  <!-- Wax drips -->
  <path d="M145 170 Q138 180 139 195 Q142 185 145 182Z" fill="#ece6d9"/>
  <path d="M255 155 Q263 165 262 180 Q259 170 255 167Z" fill="#ece6d9"/>
  <path d="M165 320 Q160 330 162 340 Q166 332 168 326Z" fill="#ddd0a0"/>
  <!-- Flame -->
  <ellipse cx="200" cy="122" rx="10" ry="16" fill="#f5c66b"/>
  <ellipse cx="200" cy="118" rx="6" ry="10" fill="#fff8e0" opacity="0.8"/>
  <!-- Wick -->
  <line x1="200" y1="128" x2="200" y2="135" stroke="#2a1a0a" stroke-width="2"/>
  <!-- Surface texture lines -->
  <line x1="150" y1="200" x2="250" y2="200" stroke="#c9a84c" stroke-width="0.5" opacity="0.2"/>
  <line x1="150" y1="230" x2="250" y2="230" stroke="#c9a84c" stroke-width="0.5" opacity="0.2"/>
  <line x1="150" y1="260" x2="250" y2="260" stroke="#c9a84c" stroke-width="0.5" opacity="0.2"/>
  <!-- Label band -->
  <rect x="145" y="245" width="110" height="30" fill="#2a1a0a" opacity="0.7"/>
  <text x="200" y="264" text-anchor="middle" fill="#f5c66b" font-size="9" font-family="serif" letter-spacing="1">BLACK AMBER</text>
  <!-- Base glow -->
  <ellipse cx="200" cy="322" rx="55" ry="8" fill="#c9a84c" opacity="0.15"/>
</svg>
